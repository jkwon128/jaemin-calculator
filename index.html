<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    :root[data-theme="dark"] {
      --bg-page: #1a1a2e;
      --bg-calc: #16213e;
      --bg-display: #0f3460;
      --bg-number: #1a1a2e;
      --bg-number-hover: #252547;
      --bg-special: #0f3460;
      --bg-special-hover: #1a4a80;
      --bg-operator: #533483;
      --bg-operator-hover: #6b44a8;
      --bg-equals: #e94560;
      --bg-equals-hover: #ff5577;
      --text-result: #e2e8f0;
      --text-expression: #a0aec0;
      --text-special: #a0aec0;
      --text-number: #e2e8f0;
      --toggle-bg: #0f3460;
      --toggle-hover: #1a4a80;
      --toggle-icon: '☀️';
    }

    :root[data-theme="light"] {
      --bg-page: #f0f2f5;
      --bg-calc: #ffffff;
      --bg-display: #e8edf5;
      --bg-number: #f5f5f5;
      --bg-number-hover: #e8e8e8;
      --bg-special: #dde3ee;
      --bg-special-hover: #cdd5e4;
      --bg-operator: #7b5ea7;
      --bg-operator-hover: #6b44a8;
      --bg-equals: #e94560;
      --bg-equals-hover: #ff5577;
      --text-result: #1a1a2e;
      --text-expression: #6b7280;
      --text-special: #374151;
      --text-number: #1a1a2e;
      --toggle-bg: #dde3ee;
      --toggle-hover: #cdd5e4;
      --toggle-icon: '🌙';
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.2s, color 0.2s;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-page);
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: var(--bg-calc);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      width: 320px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-toggle {
      background: var(--toggle-bg);
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-special);
      font-weight: 500;
    }

    .theme-toggle:hover {
      background: var(--toggle-hover);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    .display {
      background: var(--bg-display);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display .expression {
      color: var(--text-expression);
      font-size: 14px;
      min-height: 20px;
      word-break: break-all;
    }

    .display .result {
      color: var(--text-result);
      font-size: 40px;
      font-weight: 300;
      word-break: break-all;
      line-height: 1.2;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      height: 64px;
      transition: all 0.1s ease;
      outline: none;
    }

    button:active {
      transform: scale(0.94);
    }

    .btn-number {
      background: var(--bg-number);
      color: var(--text-number);
    }

    .btn-number:hover {
      background: var(--bg-number-hover);
    }

    .btn-operator {
      background: var(--bg-operator);
      color: #e2e8f0;
    }

    .btn-operator:hover {
      background: var(--bg-operator-hover);
    }

    .btn-special {
      background: var(--bg-special);
      color: var(--text-special);
    }

    .btn-special:hover {
      background: var(--bg-special-hover);
    }

    .btn-equals {
      background: var(--bg-equals);
      color: white;
    }

    .btn-equals:hover {
      background: var(--bg-equals-hover);
    }

    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="top-bar">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ 라이트</button>
    </div>
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-special" onclick="clearAll()">AC</button>
      <button class="btn-special" onclick="toggleSign()">+/-</button>
      <button class="btn-special" onclick="percentage()">%</button>
      <button class="btn-operator" onclick="inputOperator('/')">÷</button>

      <button class="btn-number" onclick="inputDigit('7')">7</button>
      <button class="btn-number" onclick="inputDigit('8')">8</button>
      <button class="btn-number" onclick="inputDigit('9')">9</button>
      <button class="btn-operator" onclick="inputOperator('*')">×</button>

      <button class="btn-number" onclick="inputDigit('4')">4</button>
      <button class="btn-number" onclick="inputDigit('5')">5</button>
      <button class="btn-number" onclick="inputDigit('6')">6</button>
      <button class="btn-operator" onclick="inputOperator('-')">−</button>

      <button class="btn-number" onclick="inputDigit('1')">1</button>
      <button class="btn-number" onclick="inputDigit('2')">2</button>
      <button class="btn-number" onclick="inputDigit('3')">3</button>
      <button class="btn-operator" onclick="inputOperator('+')">+</button>

      <button class="btn-number btn-zero" onclick="inputDigit('0')">0</button>
      <button class="btn-number" onclick="inputDot()">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentValue = '0';
    let previousValue = '';
    let operator = null;
    let shouldResetDisplay = false;
    let expression = '';

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');
    const themeBtn = document.getElementById('themeBtn');
    const html = document.documentElement;

    function toggleTheme() {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? '🌙 다크' : '☀️ 라이트';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️ 라이트' : '🌙 다크';

    function updateDisplay() {
      resultEl.textContent = currentValue;
      expressionEl.textContent = expression;
    }

    function inputDigit(digit) {
      if (shouldResetDisplay) {
        currentValue = digit;
        shouldResetDisplay = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      if (currentValue.length > 12) return;
      updateDisplay();
    }

    function inputDot() {
      if (shouldResetDisplay) {
        currentValue = '0.';
        shouldResetDisplay = false;
        updateDisplay();
        return;
      }
      if (!currentValue.includes('.')) {
        currentValue += '.';
        updateDisplay();
      }
    }

    function inputOperator(op) {
      if (operator && !shouldResetDisplay) {
        calculate(true);
      }
      previousValue = currentValue;
      operator = op;
      shouldResetDisplay = true;
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expression = previousValue + ' ' + opSymbols[op];
      updateDisplay();
    }

    function calculate(silent = false) {
      if (!operator || !previousValue) return;

      const prev = parseFloat(previousValue);
      const curr = parseFloat(currentValue);
      let result;

      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/':
          if (curr === 0) {
            currentValue = '오류';
            expression = '';
            operator = null;
            updateDisplay();
            return;
          }
          result = prev / curr;
          break;
      }

      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      if (!silent) {
        expression = previousValue + ' ' + opSymbols[operator] + ' ' + currentValue + ' =';
        operator = null;
        previousValue = '';
      }

      result = parseFloat(result.toPrecision(12));
      currentValue = String(result);
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clearAll() {
      currentValue = '0';
      previousValue = '';
      operator = null;
      shouldResetDisplay = false;
      expression = '';
      updateDisplay();
    }

    function toggleSign() {
      currentValue = String(parseFloat(currentValue) * -1);
      updateDisplay();
    }

    function percentage() {
      currentValue = String(parseFloat(currentValue) / 100);
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') inputOperator('+');
      else if (e.key === '-') inputOperator('-');
      else if (e.key === '*') inputOperator('*');
      else if (e.key === '/') { e.preventDefault(); inputOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (currentValue.length > 1) currentValue = currentValue.slice(0, -1);
        else currentValue = '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
